<svg viewBox="0 0 720 265" role="img" aria-label="Forward pass from the input 1, 1 to the loss 0.417, then backward pass with the gradient for the logits, for h, for z and for W.">
<defs><marker id="neural-networks-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="neural-networks-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<text x="10" y="22" class="dgm-text-small">Forward pass: calculate the loss</text>
<rect x="10" y="36" width="70" height="60" rx="6" class="dgm-box"/><text x="45" y="61" text-anchor="middle" class="dgm-text">Input x</text><text x="45" y="82" text-anchor="middle" class="dgm-text-mono">[1, 1]</text>
<rect x="115" y="36" width="120" height="60" rx="6" class="dgm-box"/><text x="175" y="61" text-anchor="middle" class="dgm-text">z = W x + b</text><text x="175" y="82" text-anchor="middle" class="dgm-text-mono">[−0.5, 1.0]</text>
<rect x="270" y="36" width="110" height="60" rx="6" class="dgm-box"/><text x="325" y="61" text-anchor="middle" class="dgm-text">h = ReLU(z)</text><text x="325" y="82" text-anchor="middle" class="dgm-text-mono">[0, 1]</text>
<rect x="415" y="36" width="130" height="60" rx="6" class="dgm-box"/><text x="480" y="61" text-anchor="middle" class="dgm-text">logits = U h</text><text x="480" y="82" text-anchor="middle" class="dgm-text-mono">[0.1, 1.0, 2.0]</text>
<rect x="580" y="36" width="130" height="60" rx="6" class="dgm-box"/><text x="645" y="61" text-anchor="middle" class="dgm-text">softmax, loss</text><text x="645" y="82" text-anchor="middle" class="dgm-text-mono">0.417</text>
<path d="M80 66H111" class="dgm-arrow" marker-end="url(#neural-networks-head)"/><path d="M235 66H266" class="dgm-arrow" marker-end="url(#neural-networks-head)"/><path d="M380 66H411" class="dgm-arrow" marker-end="url(#neural-networks-head)"/><path d="M545 66H576" class="dgm-arrow" marker-end="url(#neural-networks-head)"/>
<text x="10" y="150" class="dgm-text-small">Backward pass: send the gradient back</text>
<path d="M645 96V156" class="dgm-arrow-accent" marker-end="url(#neural-networks-head-accent)"/><text x="655" y="132" class="dgm-text-small">p − y</text>
<rect x="525" y="160" width="185" height="72" rx="6" class="dgm-box-accent"/><text x="617" y="188" text-anchor="middle" class="dgm-text">gradient for logits</text><text x="617" y="212" text-anchor="middle" class="dgm-text-mono">[0.099, 0.242, −0.341]</text>
<rect x="350" y="160" width="140" height="72" rx="6" class="dgm-box-accent"/><text x="420" y="188" text-anchor="middle" class="dgm-text">gradient for h</text><text x="420" y="212" text-anchor="middle" class="dgm-text-mono">[−0.102, −0.430]</text>
<rect x="195" y="160" width="120" height="72" rx="6" class="dgm-box-accent"/><text x="255" y="188" text-anchor="middle" class="dgm-text">gradient for z</text><text x="255" y="212" text-anchor="middle" class="dgm-text-mono">[0, −0.430]</text>
<rect x="20" y="160" width="140" height="72" rx="6" class="dgm-box-accent"/><text x="90" y="182" text-anchor="middle" class="dgm-text">gradient for W</text><text x="90" y="203" text-anchor="middle" class="dgm-text-mono">[0, 0]</text><text x="90" y="222" text-anchor="middle" class="dgm-text-mono">[−0.430, −0.430]</text>
<path d="M525 196H494" class="dgm-arrow-accent" marker-end="url(#neural-networks-head-accent)"/><path d="M350 196H319" class="dgm-arrow-accent" marker-end="url(#neural-networks-head-accent)"/><path d="M195 196H164" class="dgm-arrow-accent" marker-end="url(#neural-networks-head-accent)"/>
<text x="507" y="252" text-anchor="middle" class="dgm-text-small">× Uᵀ</text><text x="332" y="252" text-anchor="middle" class="dgm-text-small">× slope of ReLU = [0, 1]</text><text x="179" y="252" text-anchor="middle" class="dgm-text-small">× xᵀ</text>
</svg>
