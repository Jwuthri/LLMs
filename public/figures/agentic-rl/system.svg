<svg viewBox="0 0 720 316" role="img" aria-label="The parts of an agentic RL system: the rollout engine generates turns and sends tool calls to the environment sandbox, which returns feedback; finished episodes get a reward and a loss mask; the trainer computes the masked loss and updates the weights; the new weights go back to the rollout engine.">
<defs><marker id="agentic-rl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="agentic-rl-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<rect x="10" y="40" width="120" height="64" rx="6" class="dgm-box"/><text x="70" y="66" text-anchor="middle" class="dgm-text">Prompts</text><text x="70" y="88" text-anchor="middle" class="dgm-text-small">tasks of the batch</text>
<path d="M130 72H168" class="dgm-arrow" marker-end="url(#agentic-rl-head)"/>
<rect x="172" y="30" width="210" height="84" rx="6" class="dgm-box-accent"/><text x="277" y="56" text-anchor="middle" class="dgm-text">Rollout engine</text><text x="277" y="78" text-anchor="middle" class="dgm-text-small">vLLM or SGLang</text><text x="277" y="96" text-anchor="middle" class="dgm-text-small">writes the model turns</text>
<rect x="470" y="30" width="240" height="84" rx="6" class="dgm-box"/><text x="590" y="56" text-anchor="middle" class="dgm-text">Environment and sandbox</text><text x="590" y="78" text-anchor="middle" class="dgm-text-small">runs each tool call (check)</text><text x="590" y="96" text-anchor="middle" class="dgm-text-small">code runs isolated here</text>
<path d="M382 56H466" class="dgm-arrow" marker-end="url(#agentic-rl-head)"/><text x="426" y="48" text-anchor="middle" class="dgm-text-small">tool call</text>
<path d="M470 92H386" class="dgm-arrow" marker-end="url(#agentic-rl-head)"/><text x="426" y="110" text-anchor="middle" class="dgm-text-small">feedback</text>
<rect x="470" y="190" width="240" height="84" rx="6" class="dgm-box"/><text x="590" y="216" text-anchor="middle" class="dgm-text">Reward and loss mask</text><text x="590" y="238" text-anchor="middle" class="dgm-text-small">score each episode or turn</text><text x="590" y="256" text-anchor="middle" class="dgm-text-small">mask = 1 on model tokens</text>
<path d="M590 114V186" class="dgm-arrow" marker-end="url(#agentic-rl-head)"/><text x="598" y="154" class="dgm-text-small">finished episodes</text>
<rect x="172" y="190" width="210" height="84" rx="6" class="dgm-box-accent"/><text x="277" y="216" text-anchor="middle" class="dgm-text">Trainer</text><text x="277" y="238" text-anchor="middle" class="dgm-text-small">FSDP or Megatron-LM</text><text x="277" y="256" text-anchor="middle" class="dgm-text-small">masked loss, one update</text>
<path d="M470 232H386" class="dgm-arrow" marker-end="url(#agentic-rl-head)"/><text x="426" y="224" text-anchor="middle" class="dgm-text-small">tokens, mask, A</text>
<path d="M277 190V118" class="dgm-arrow-accent" marker-end="url(#agentic-rl-head-accent)"/><text x="269" y="150" text-anchor="end" class="dgm-text-small">weight sync</text><text x="269" y="166" text-anchor="end" class="dgm-text-small">after each update</text>
<text x="10" y="302" class="dgm-text-small">A controller (for example Ray in OpenRLHF) puts each part on its GPUs and moves the data.</text>
</svg>
