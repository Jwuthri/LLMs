<svg viewBox="0 0 720 176" role="img" aria-label="The forward process adds noise to the data point [1, 1] in 3 steps: [1.138, 0.696], then [1.131, 0.141], then [0.885, -0.443]. The signal-to-noise ratio goes from 9 to 1 to 0.111. The reverse process goes in the other direction: a trained denoiser removes the noise step by step.">
<defs><marker id="diffusion-process-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="diffusion-process-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<text x="14" y="24" class="dgm-text-small">Forward process (upper arrows, left to right): a fixed rule adds noise. No learning.</text>
<rect x="14" y="40" width="140" height="64" rx="6" class="dgm-box-accent"/><text x="84" y="65" text-anchor="middle" class="dgm-text">data: sat</text><text x="84" y="88" text-anchor="middle" class="dgm-text-mono">[1, 1]</text><text x="84" y="124" text-anchor="middle" class="dgm-text-small">no noise</text>
<rect x="198" y="40" width="140" height="64" rx="6" class="dgm-box"/><text x="268" y="65" text-anchor="middle" class="dgm-text">t = 1</text><text x="268" y="88" text-anchor="middle" class="dgm-text-mono">[1.138, 0.696]</text><text x="268" y="124" text-anchor="middle" class="dgm-text-small">signal-to-noise 9</text>
<rect x="382" y="40" width="140" height="64" rx="6" class="dgm-box"/><text x="452" y="65" text-anchor="middle" class="dgm-text">t = 2</text><text x="452" y="88" text-anchor="middle" class="dgm-text-mono">[1.131, 0.141]</text><text x="452" y="124" text-anchor="middle" class="dgm-text-small">signal-to-noise 1</text>
<rect x="566" y="40" width="140" height="64" rx="6" class="dgm-box"/><text x="636" y="65" text-anchor="middle" class="dgm-text">t = 3</text><text x="636" y="88" text-anchor="middle" class="dgm-text-mono">[0.885, −0.443]</text><text x="636" y="124" text-anchor="middle" class="dgm-text-small">signal-to-noise 0.111</text>
<path d="M154 60H194" class="dgm-arrow" marker-end="url(#diffusion-process-head)"/>
<path d="M198 86H158" class="dgm-arrow-accent" marker-end="url(#diffusion-process-head-accent)"/>
<path d="M338 60H378" class="dgm-arrow" marker-end="url(#diffusion-process-head)"/>
<path d="M382 86H342" class="dgm-arrow-accent" marker-end="url(#diffusion-process-head-accent)"/>
<path d="M522 60H562" class="dgm-arrow" marker-end="url(#diffusion-process-head)"/>
<path d="M566 86H526" class="dgm-arrow-accent" marker-end="url(#diffusion-process-head-accent)"/>
<text x="14" y="158" class="dgm-text-small">Reverse process (lower arrows, right to left): a trained denoiser removes noise. This is generation.</text>
</svg>
