<svg viewBox="0 0 720 264" role="img" aria-label="The RAG loop. Indexing: the file cat.md is split into 3 chunks, each chunk is embedded, and the vectors go into the vector store. Query: the question What does the cat eat becomes the vector 0.6, 1.2, the store returns c2 with 0.997 and c3 with 0.956, the prompt gets the 2 chunks and the question, and the LLM answers The cat eats fish.">
<defs><marker id="rag-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="rag-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<text x="10" y="24" class="dgm-text-small">Indexing: one time for each document (page 2)</text>
<rect x="10" y="36" width="140" height="60" rx="6" class="dgm-box"/><text x="80" y="60" text-anchor="middle" class="dgm-text">Document</text><text x="80" y="82" text-anchor="middle" class="dgm-text-mono">cat.md</text>
<rect x="196" y="36" width="140" height="60" rx="6" class="dgm-box"/><text x="266" y="60" text-anchor="middle" class="dgm-text">Split</text><text x="266" y="82" text-anchor="middle" class="dgm-text-mono">3 chunks</text>
<rect x="382" y="36" width="140" height="60" rx="6" class="dgm-box"/><text x="452" y="60" text-anchor="middle" class="dgm-text">Embed</text><text x="452" y="82" text-anchor="middle" class="dgm-text-mono">3 vectors</text>
<rect x="568" y="36" width="140" height="60" rx="6" class="dgm-box-accent"/><text x="638" y="60" text-anchor="middle" class="dgm-text">Vector store</text><text x="638" y="82" text-anchor="middle" class="dgm-text-mono">c1 c2 c3</text>
<path d="M150 66H192" class="dgm-arrow" marker-end="url(#rag-head)"/><path d="M336 66H378" class="dgm-arrow" marker-end="url(#rag-head)"/><path d="M522 66H564" class="dgm-arrow" marker-end="url(#rag-head)"/>
<text x="10" y="156" class="dgm-text-small">Query: for each question</text>
<rect x="10" y="170" width="124" height="80" rx="6" class="dgm-box"/><text x="72" y="192" text-anchor="middle" class="dgm-text">Question</text><text x="72" y="214" text-anchor="middle" class="dgm-text-mono">What does</text><text x="72" y="232" text-anchor="middle" class="dgm-text-mono">the cat eat?</text>
<rect x="154" y="170" width="124" height="80" rx="6" class="dgm-box"/><text x="216" y="192" text-anchor="middle" class="dgm-text">1 Embed</text><text x="216" y="222" text-anchor="middle" class="dgm-text-mono">[0.6, 1.2]</text>
<rect x="298" y="170" width="124" height="80" rx="6" class="dgm-box-accent"/><text x="360" y="192" text-anchor="middle" class="dgm-text">2 Top-2</text><text x="360" y="214" text-anchor="middle" class="dgm-text-mono">c2 0.997</text><text x="360" y="232" text-anchor="middle" class="dgm-text-mono">c3 0.956</text>
<rect x="442" y="170" width="124" height="80" rx="6" class="dgm-box"/><text x="504" y="192" text-anchor="middle" class="dgm-text">3 Prompt</text><text x="504" y="214" text-anchor="middle" class="dgm-text-small">2 chunks</text><text x="504" y="232" text-anchor="middle" class="dgm-text-small">+ the question</text>
<rect x="586" y="170" width="124" height="80" rx="6" class="dgm-box"/><text x="648" y="192" text-anchor="middle" class="dgm-text">4 LLM answer</text><text x="648" y="214" text-anchor="middle" class="dgm-text-mono">The cat</text><text x="648" y="232" text-anchor="middle" class="dgm-text-mono">eats fish.</text>
<path d="M134 210H150" class="dgm-arrow" marker-end="url(#rag-head)"/><path d="M278 210H294" class="dgm-arrow" marker-end="url(#rag-head)"/><path d="M422 210H438" class="dgm-arrow" marker-end="url(#rag-head)"/><path d="M566 210H582" class="dgm-arrow" marker-end="url(#rag-head)"/>
<path d="M638 96V132H360V166" class="dgm-arrow-accent" marker-end="url(#rag-head-accent)"/><text x="499" y="124" text-anchor="middle" class="dgm-text-small">compare the question vector with each chunk vector</text>
</svg>
