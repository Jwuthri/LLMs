<svg viewBox="0 0 720 186" role="img" aria-label="The intended goal reaches the behaviour of the model in three steps: intended goal, specification, learned goal, behaviour. Gap 1, outer alignment, is between the intended goal and the specification: in the toy the reward is 1.0 and the goal is 0.0. Gap 2, inner alignment, is between the specification and the learned goal: in the toy the accuracy is 1.0 in training and 0.0 in deployment.">
