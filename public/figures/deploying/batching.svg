<svg viewBox="0 0 720 214" role="img" aria-label="Static batching: requests B and C end early and their slots stay idle until request A ends. Continuous batching: requests D and E start in the free slots at the next decode step.">
<text x="14" y="24" class="dgm-text">Static batching</text>
<text x="14" y="62" class="dgm-text-small">slot 1</text><rect x="60" y="42" width="280" height="30" rx="4" class="dgm-box"/><text x="200" y="62" text-anchor="middle" class="dgm-text-small">request A (long answer)</text>
<text x="14" y="100" class="dgm-text-small">slot 2</text><rect x="60" y="80" width="100" height="30" rx="4" class="dgm-box"/><text x="110" y="100" text-anchor="middle" class="dgm-text-small">request B</text><rect x="166" y="80" width="174" height="30" rx="4" class="dgm-box-warm"/><text x="253" y="100" text-anchor="middle" class="dgm-text-small">idle</text>
<text x="14" y="138" class="dgm-text-small">slot 3</text><rect x="60" y="118" width="150" height="30" rx="4" class="dgm-box"/><text x="135" y="138" text-anchor="middle" class="dgm-text-small">request C</text><rect x="216" y="118" width="124" height="30" rx="4" class="dgm-box-warm"/><text x="278" y="138" text-anchor="middle" class="dgm-text-small">idle</text>
<text x="14" y="176" class="dgm-text-small">Requests D and E wait until the full batch ends.</text>
<text x="14" y="198" class="dgm-text-small">time →</text>
<path d="M360 14V202" class="dgm-arrow" style="stroke-dasharray:4 4"/>
<text x="380" y="24" class="dgm-text">Continuous batching</text>
<text x="380" y="62" class="dgm-text-small">slot 1</text><rect x="426" y="42" width="280" height="30" rx="4" class="dgm-box"/><text x="566" y="62" text-anchor="middle" class="dgm-text-small">request A (long answer)</text>
<text x="380" y="100" class="dgm-text-small">slot 2</text><rect x="426" y="80" width="100" height="30" rx="4" class="dgm-box"/><text x="476" y="100" text-anchor="middle" class="dgm-text-small">request B</text><rect x="532" y="80" width="174" height="30" rx="4" class="dgm-box-accent"/><text x="619" y="100" text-anchor="middle" class="dgm-text-small">request D</text>
<text x="380" y="138" class="dgm-text-small">slot 3</text><rect x="426" y="118" width="150" height="30" rx="4" class="dgm-box"/><text x="501" y="138" text-anchor="middle" class="dgm-text-small">request C</text><rect x="582" y="118" width="124" height="30" rx="4" class="dgm-box-accent"/><text x="644" y="138" text-anchor="middle" class="dgm-text-small">request E</text>
<text x="380" y="176" class="dgm-text-small">D and E start at the next decode step.</text>
<text x="380" y="198" class="dgm-text-small">time →</text>
</svg>
