<svg viewBox="0 0 720 270" role="img" aria-label="The answer sat cat sat under two reward types. Outcome reward: rewards 0, 0, 0.667, so the reward-to-go is 0.667 at each token. Process reward: rewards 0, 0.333, 0.333, so the reward-to-go is 0.667, 0.667, 0.333.">
<defs><marker id="rewards-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="dgm-head"/></marker></defs>
<text x="360" y="24" text-anchor="middle" class="dgm-text-small">One answer, "sat cat sat" (2 of 3 tokens correct), with gamma = 1.</text>
<text x="24" y="66" class="dgm-text">Outcome</text>
<text x="24" y="84" class="dgm-text-small">one reward at the end</text>
<rect x="180" y="46" width="120" height="44" rx="6" class="dgm-box"/><text x="240" y="74" text-anchor="middle" class="dgm-text-mono">sat (wrong)</text>
<rect x="340" y="46" width="120" height="44" rx="6" class="dgm-box"/><text x="400" y="74" text-anchor="middle" class="dgm-text-mono">cat</text>
<rect x="500" y="46" width="120" height="44" rx="6" class="dgm-box"/><text x="560" y="74" text-anchor="middle" class="dgm-text-mono">sat</text>
<line x1="300" y1="68" x2="338" y2="68" class="dgm-arrow" marker-end="url(#rewards-head)"/><line x1="460" y1="68" x2="498" y2="68" class="dgm-arrow" marker-end="url(#rewards-head)"/>
<text x="240" y="110" text-anchor="middle" class="dgm-text-small">r = 0</text><text x="400" y="110" text-anchor="middle" class="dgm-text-small">r = 0</text><text x="560" y="110" text-anchor="middle" class="dgm-text-small">r = 0.667</text>
<text x="240" y="128" text-anchor="middle" class="dgm-text-mono">G = 0.667</text><text x="400" y="128" text-anchor="middle" class="dgm-text-mono">G = 0.667</text><text x="560" y="128" text-anchor="middle" class="dgm-text-mono">G = 0.667</text>
<text x="24" y="176" class="dgm-text">Process</text>
<text x="24" y="194" class="dgm-text-small">one reward per step</text>
<rect x="180" y="156" width="120" height="44" rx="6" class="dgm-box"/><text x="240" y="184" text-anchor="middle" class="dgm-text-mono">sat (wrong)</text>
<rect x="340" y="156" width="120" height="44" rx="6" class="dgm-box-accent"/><text x="400" y="184" text-anchor="middle" class="dgm-text-mono">cat</text>
<rect x="500" y="156" width="120" height="44" rx="6" class="dgm-box-accent"/><text x="560" y="184" text-anchor="middle" class="dgm-text-mono">sat</text>
<line x1="300" y1="178" x2="338" y2="178" class="dgm-arrow" marker-end="url(#rewards-head)"/><line x1="460" y1="178" x2="498" y2="178" class="dgm-arrow" marker-end="url(#rewards-head)"/>
<text x="240" y="220" text-anchor="middle" class="dgm-text-small">r = 0</text><text x="400" y="220" text-anchor="middle" class="dgm-text-small">r = 0.333</text><text x="560" y="220" text-anchor="middle" class="dgm-text-small">r = 0.333</text>
<text x="240" y="238" text-anchor="middle" class="dgm-text-mono">G = 0.667</text><text x="400" y="238" text-anchor="middle" class="dgm-text-mono">G = 0.667</text><text x="560" y="238" text-anchor="middle" class="dgm-text-mono">G = 0.333</text>
<text x="360" y="262" text-anchor="middle" class="dgm-text-small">G = reward-to-go = the sum of the rewards from this token to the end. Highlighted: a step that earns a reward.</text>
</svg>
