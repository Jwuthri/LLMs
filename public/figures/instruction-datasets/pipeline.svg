<svg viewBox="0 0 720 176" role="img" aria-label="The four parts of the page. Part 1: the toy dataset has the topic shares 0.5 for math, 0.25 for code and 0.25 for chat. Part 2: a licence filter keeps 6.279 million of 9.679 million samples. Part 3: a cap of 500k for each source changes a mix of 5.1 million samples into 1.1 million. Part 4: the KL divergence between real conversations and the toy mix is 0.218.">
<defs><marker id="instruction-datasets-pipeline-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<text x="14" y="24" class="dgm-text-small">From public datasets to one training mix</text>
<rect x="14" y="38" width="150" height="92" rx="6" class="dgm-box"/><text x="89" y="62" text-anchor="middle" class="dgm-text">1. Families</text><text x="89" y="84" text-anchor="middle" class="dgm-text-small">shares of the 8 samples</text><text x="89" y="104" text-anchor="middle" class="dgm-text-mono">math 0.5</text><text x="89" y="121" text-anchor="middle" class="dgm-text-mono">code, chat 0.25</text>
<rect x="194" y="38" width="150" height="92" rx="6" class="dgm-box-accent"/><text x="269" y="62" text-anchor="middle" class="dgm-text">2. Dataset card</text><text x="269" y="84" text-anchor="middle" class="dgm-text-small">licence filter</text><text x="269" y="104" text-anchor="middle" class="dgm-text-mono">9.679M samples</text><text x="269" y="121" text-anchor="middle" class="dgm-text-mono">6.279M kept</text>
<rect x="374" y="38" width="150" height="92" rx="6" class="dgm-box-accent"/><text x="449" y="62" text-anchor="middle" class="dgm-text">3. Mix</text><text x="449" y="84" text-anchor="middle" class="dgm-text-small">cap of 500k per source</text><text x="449" y="104" text-anchor="middle" class="dgm-text-mono">5.1M samples</text><text x="449" y="121" text-anchor="middle" class="dgm-text-mono">1.1M kept</text>
<rect x="554" y="38" width="152" height="92" rx="6" class="dgm-box-warm"/><text x="630" y="62" text-anchor="middle" class="dgm-text">4. Check</text><text x="630" y="84" text-anchor="middle" class="dgm-text-small">real conversations</text><text x="630" y="104" text-anchor="middle" class="dgm-text-mono">KL = 0.218</text><text x="630" y="121" text-anchor="middle" class="dgm-text-mono">largest gap 0.3</text>
<path d="M164 84H190" class="dgm-arrow-accent" marker-end="url(#instruction-datasets-pipeline-head)"/>
<path d="M344 84H370" class="dgm-arrow-accent" marker-end="url(#instruction-datasets-pipeline-head)"/>
<path d="M524 84H550" class="dgm-arrow-accent" marker-end="url(#instruction-datasets-pipeline-head)"/>
<text x="14" y="158" class="dgm-text-small">Choose the families, read each card, cap each source, then compare the mix with what users ask.</text>
</svg>
