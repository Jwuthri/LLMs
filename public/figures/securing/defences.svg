<svg viewBox="0 0 720 176" role="img" aria-label="Layers of defence: untrusted text goes through an input filter that catches 3 of 4 attacks, a model with least privilege, an output check that catches the leaked prompt, and a tool policy that allows, asks a human or denies.">
<defs><marker id="securing-defences-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker></defs>
<rect x="14" y="30" width="112" height="64" rx="6" class="dgm-box"/><text x="70" y="56" text-anchor="middle" class="dgm-text">Untrusted</text><text x="70" y="78" text-anchor="middle" class="dgm-text">text</text>
<rect x="160" y="30" width="112" height="64" rx="6" class="dgm-box-accent"/><text x="216" y="56" text-anchor="middle" class="dgm-text">Input filter</text><text x="216" y="78" text-anchor="middle" class="dgm-text-small">catches 3 of 4</text>
<rect x="306" y="30" width="112" height="64" rx="6" class="dgm-box"/><text x="362" y="56" text-anchor="middle" class="dgm-text">Model</text><text x="362" y="78" text-anchor="middle" class="dgm-text-small">least privilege</text>
<rect x="452" y="30" width="112" height="64" rx="6" class="dgm-box-accent"/><text x="508" y="56" text-anchor="middle" class="dgm-text">Output check</text><text x="508" y="78" text-anchor="middle" class="dgm-text-small">catches the leak</text>
<rect x="598" y="30" width="112" height="64" rx="6" class="dgm-box-accent"/><text x="654" y="56" text-anchor="middle" class="dgm-text">Tool policy</text><text x="654" y="78" text-anchor="middle" class="dgm-text-small">allow, ask, deny</text>
<path d="M126 62H156" class="dgm-arrow" marker-end="url(#securing-defences-head)"/><path d="M272 62H302" class="dgm-arrow" marker-end="url(#securing-defences-head)"/><path d="M418 62H448" class="dgm-arrow" marker-end="url(#securing-defences-head)"/><path d="M564 62H594" class="dgm-arrow" marker-end="url(#securing-defences-head)"/>
<text x="216" y="122" text-anchor="middle" class="dgm-text-small">misses the</text><text x="216" y="140" text-anchor="middle" class="dgm-text-small">reworded text</text>
<text x="362" y="122" text-anchor="middle" class="dgm-text-small">has only the</text><text x="362" y="140" text-anchor="middle" class="dgm-text-small">tools it needs</text>
<text x="508" y="122" text-anchor="middle" class="dgm-text-small">misses the</text><text x="508" y="140" text-anchor="middle" class="dgm-text-small">answer "CAT"</text>
<text x="654" y="122" text-anchor="middle" class="dgm-text-small">stops the action,</text><text x="654" y="140" text-anchor="middle" class="dgm-text-small">not the text</text>
<text x="14" y="166" class="dgm-text-small">Each layer has a gap. The layers together leave a smaller gap.</text>
</svg>
