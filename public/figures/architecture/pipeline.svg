<svg viewBox="0 0 720 250" role="img" aria-label="Data flow of a decoder-only model: text, token ids, embeddings, Transformer blocks, logits, probabilities, next token, then back to the input.">
<defs><marker id="arch-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="arch-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<rect x="10" y="40" width="100" height="64" rx="6" class="dgm-box"/><text x="60" y="66" text-anchor="middle" class="dgm-text">Text</text><text x="60" y="88" text-anchor="middle" class="dgm-text-mono">"the cat"</text>
<rect x="150" y="40" width="100" height="64" rx="6" class="dgm-box"/><text x="200" y="66" text-anchor="middle" class="dgm-text">Token ids</text><text x="200" y="88" text-anchor="middle" class="dgm-text-mono">[0, 1]</text>
<rect x="290" y="40" width="110" height="64" rx="6" class="dgm-box"/><text x="345" y="66" text-anchor="middle" class="dgm-text">Embeddings</text><text x="345" y="88" text-anchor="middle" class="dgm-text-mono">[1,0] [0,1]</text>
<rect x="440" y="24" width="130" height="96" rx="6" class="dgm-box-accent"/><text x="505" y="52" text-anchor="middle" class="dgm-text">N blocks</text><text x="505" y="74" text-anchor="middle" class="dgm-text-small">attention</text><text x="505" y="92" text-anchor="middle" class="dgm-text-small">+ feed-forward</text>
<rect x="610" y="40" width="100" height="64" rx="6" class="dgm-box"/><text x="660" y="66" text-anchor="middle" class="dgm-text">Logits</text><text x="660" y="88" text-anchor="middle" class="dgm-text-mono">[0.1, 1, 2]</text>
<path d="M110 72H146" class="dgm-arrow" marker-end="url(#arch-head)"/><path d="M250 72H286" class="dgm-arrow" marker-end="url(#arch-head)"/><path d="M400 72H436" class="dgm-arrow" marker-end="url(#arch-head)"/><path d="M570 72H606" class="dgm-arrow" marker-end="url(#arch-head)"/>
<text x="128" y="62" text-anchor="middle" class="dgm-text-small">1</text><text x="268" y="62" text-anchor="middle" class="dgm-text-small">2</text><text x="418" y="62" text-anchor="middle" class="dgm-text-small">3</text><text x="588" y="62" text-anchor="middle" class="dgm-text-small">4</text>
<rect x="560" y="166" width="150" height="64" rx="6" class="dgm-box"/><text x="635" y="192" text-anchor="middle" class="dgm-text">Probabilities</text><text x="635" y="214" text-anchor="middle" class="dgm-text-mono">[0.10, 0.24, 0.66]</text>
<rect x="330" y="166" width="150" height="64" rx="6" class="dgm-box"/><text x="405" y="192" text-anchor="middle" class="dgm-text">Next token</text><text x="405" y="214" text-anchor="middle" class="dgm-text-mono">"sat" (id 2)</text>
<path d="M660 104V162" class="dgm-arrow" marker-end="url(#arch-head)"/><text x="650" y="138" text-anchor="end" class="dgm-text-small">5 softmax</text>
<path d="M560 198H484" class="dgm-arrow" marker-end="url(#arch-head)"/><text x="522" y="188" text-anchor="middle" class="dgm-text-small">6 sample</text>
<path d="M330 198H60V108" class="dgm-arrow-accent" marker-end="url(#arch-head-accent)"/><text x="190" y="188" text-anchor="middle" class="dgm-text-small">7 append the token, run again</text>
</svg>
