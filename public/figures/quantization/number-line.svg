<svg viewBox="0 0 720 215" role="img" aria-label="A number line from -1.2 to 1.2 with 15 integer positions from -7 to 7. The weights -1.2, 0.3, 0.5 and 0.8 move to the nearest positions -7, 2, 3 and 5, which give the values -1.2, 0.343, 0.514 and 0.857.">
