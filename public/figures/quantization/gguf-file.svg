<svg viewBox="0 0 720 130" role="img" aria-label="The four parts of a GGUF file in order: header, metadata, tensor info, tensor data. The tensor data holds the quantized weights and is most of the file.">
<defs><marker id="quantization-gguf-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker></defs>
<text x="20" y="22" class="dgm-text-small">One GGUF file, from the first byte to the last byte</text>
<rect x="14" y="36" width="126" height="80" rx="6" class="dgm-box"/><text x="77" y="60" text-anchor="middle" class="dgm-text">Header</text><text x="77" y="82" text-anchor="middle" class="dgm-text-small">magic "GGUF"</text><text x="77" y="100" text-anchor="middle" class="dgm-text-small">version, counts</text>
<rect x="164" y="36" width="190" height="80" rx="6" class="dgm-box"/><text x="259" y="60" text-anchor="middle" class="dgm-text">Metadata</text><text x="259" y="82" text-anchor="middle" class="dgm-text-small">architecture, context length,</text><text x="259" y="100" text-anchor="middle" class="dgm-text-small">vocabulary, chat template</text>
<rect x="378" y="36" width="140" height="80" rx="6" class="dgm-box"/><text x="448" y="60" text-anchor="middle" class="dgm-text">Tensor info</text><text x="448" y="82" text-anchor="middle" class="dgm-text-small">name, shape, type,</text><text x="448" y="100" text-anchor="middle" class="dgm-text-small">position in the file</text>
<rect x="542" y="36" width="164" height="80" rx="6" class="dgm-box-accent"/><text x="624" y="60" text-anchor="middle" class="dgm-text">Tensor data</text><text x="624" y="82" text-anchor="middle" class="dgm-text-small">the quantized weights</text><text x="624" y="100" text-anchor="middle" class="dgm-text-small">(most of the file)</text>
<path d="M140 76H160" class="dgm-arrow" marker-end="url(#quantization-gguf-head)"/><path d="M354 76H374" class="dgm-arrow" marker-end="url(#quantization-gguf-head)"/><path d="M518 76H538" class="dgm-arrow" marker-end="url(#quantization-gguf-head)"/>
</svg>
