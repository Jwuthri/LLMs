<svg viewBox="0 0 720 270" role="img" aria-label="Advanced RAG pipeline. A router reads the question and chooses a tool: the vector store with a metadata filter, the SQL database, or the calculator. Text from the vector store goes through post-processing: fusion, re-ranking, diversity. All results go into a prompt that is chosen by a metric, then to the LLM.">
<defs><marker id="advanced-rag-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="advanced-rag-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<rect x="10" y="110" width="110" height="60" rx="6" class="dgm-box"/><text x="65" y="145" text-anchor="middle" class="dgm-text">Question</text>
<rect x="156" y="96" width="144" height="88" rx="6" class="dgm-box-accent"/><text x="228" y="122" text-anchor="middle" class="dgm-text">Router (LLM)</text><text x="228" y="144" text-anchor="middle" class="dgm-text-small">1 which query?</text><text x="228" y="162" text-anchor="middle" class="dgm-text-small">2 which tool?</text>
<path d="M120 140H152" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/>
<rect x="340" y="24" width="150" height="62" rx="6" class="dgm-box"/><text x="415" y="48" text-anchor="middle" class="dgm-text">Vector store</text><text x="415" y="70" text-anchor="middle" class="dgm-text-small">filter: section = Food</text>
<rect x="340" y="109" width="150" height="62" rx="6" class="dgm-box"/><text x="415" y="133" text-anchor="middle" class="dgm-text">SQL database</text><text x="415" y="155" text-anchor="middle" class="dgm-text-mono">SUM(grams) = 140</text>
<rect x="340" y="194" width="150" height="62" rx="6" class="dgm-box"/><text x="415" y="218" text-anchor="middle" class="dgm-text">Calculator</text><text x="415" y="240" text-anchor="middle" class="dgm-text-mono">60 + 80 = 140</text>
<path d="M300 122L337 60" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/><path d="M300 140H336" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/><path d="M300 158L337 220" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/>
<rect x="530" y="24" width="180" height="62" rx="6" class="dgm-box"/><text x="620" y="46" text-anchor="middle" class="dgm-text">3 Post-processing</text><text x="620" y="64" text-anchor="middle" class="dgm-text-small">fuse (RRF), re-rank,</text><text x="620" y="79" text-anchor="middle" class="dgm-text-small">diversity (MMR)</text>
<rect x="530" y="152" width="180" height="62" rx="6" class="dgm-box-accent"/><text x="620" y="176" text-anchor="middle" class="dgm-text">4 Prompt, then LLM</text><text x="620" y="198" text-anchor="middle" class="dgm-text-small">prompt chosen by a metric</text>
<path d="M490 55H526" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/>
<path d="M620 86V148" class="dgm-arrow-accent" marker-end="url(#advanced-rag-head-accent)"/><text x="630" y="122" class="dgm-text-small">best chunks</text>
<path d="M490 140L527 168" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/><path d="M490 225L527 198" class="dgm-arrow" marker-end="url(#advanced-rag-head)"/>
<text x="508" y="244" class="dgm-text-small">numbers go to the prompt directly</text>
</svg>
