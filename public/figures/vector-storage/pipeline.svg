<svg viewBox="0 0 720 236" role="img" aria-label="Indexing pipeline: load the file cat.md, clean it, split it into 3 chunks, embed each chunk into 2 numbers, store a 3 by 2 matrix. Search: the query the cat sat becomes the vector 0.667, 0.667 and the store returns c1 with 0.981 and c2 with 0.919.">
<defs><marker id="vector-storage-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="vector-storage-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<text x="10" y="24" class="dgm-text-small">Indexing: one time for each document</text>
<rect x="10" y="36" width="124" height="74" rx="6" class="dgm-box"/><text x="72" y="58" text-anchor="middle" class="dgm-text">1 Load</text><text x="72" y="79" text-anchor="middle" class="dgm-text-mono">cat.md</text><text x="72" y="98" text-anchor="middle" class="dgm-text-small">112 characters</text>
<rect x="154" y="36" width="124" height="74" rx="6" class="dgm-box"/><text x="216" y="58" text-anchor="middle" class="dgm-text">2 Clean</text><text x="216" y="79" text-anchor="middle" class="dgm-text-mono">96 characters</text><text x="216" y="98" text-anchor="middle" class="dgm-text-small">footer removed</text>
<rect x="298" y="36" width="124" height="74" rx="6" class="dgm-box"/><text x="360" y="58" text-anchor="middle" class="dgm-text">3 Split</text><text x="360" y="79" text-anchor="middle" class="dgm-text-mono">3 chunks</text><text x="360" y="98" text-anchor="middle" class="dgm-text-small">6 words or less</text>
<rect x="442" y="36" width="124" height="74" rx="6" class="dgm-box"/><text x="504" y="58" text-anchor="middle" class="dgm-text">4 Embed</text><text x="504" y="79" text-anchor="middle" class="dgm-text-mono">[1, 0.667]</text><text x="504" y="98" text-anchor="middle" class="dgm-text-small">2 numbers for c1</text>
<rect x="586" y="36" width="124" height="74" rx="6" class="dgm-box-accent"/><text x="648" y="58" text-anchor="middle" class="dgm-text">5 Store</text><text x="648" y="79" text-anchor="middle" class="dgm-text-mono">3 x 2 matrix</text><text x="648" y="98" text-anchor="middle" class="dgm-text-small">+ text + metadata</text>
<path d="M134 73H150" class="dgm-arrow" marker-end="url(#vector-storage-head)"/><path d="M278 73H294" class="dgm-arrow" marker-end="url(#vector-storage-head)"/><path d="M422 73H438" class="dgm-arrow" marker-end="url(#vector-storage-head)"/><path d="M566 73H582" class="dgm-arrow" marker-end="url(#vector-storage-head)"/>
<text x="10" y="150" class="dgm-text-small">Search: for each query</text>
<rect x="10" y="162" width="160" height="62" rx="6" class="dgm-box"/><text x="90" y="186" text-anchor="middle" class="dgm-text">Query</text><text x="90" y="208" text-anchor="middle" class="dgm-text-mono">the cat sat</text>
<rect x="280" y="162" width="160" height="62" rx="6" class="dgm-box"/><text x="360" y="186" text-anchor="middle" class="dgm-text">Query vector</text><text x="360" y="208" text-anchor="middle" class="dgm-text-mono">[0.667, 0.667]</text>
<rect x="550" y="162" width="160" height="62" rx="6" class="dgm-box-accent"/><text x="630" y="186" text-anchor="middle" class="dgm-text">Top-2 by cosine</text><text x="630" y="208" text-anchor="middle" class="dgm-text-mono">c1 0.981 c2 0.919</text>
<path d="M170 193H276" class="dgm-arrow" marker-end="url(#vector-storage-head)"/><text x="223" y="184" text-anchor="middle" class="dgm-text-small">same model</text>
<path d="M440 193H546" class="dgm-arrow" marker-end="url(#vector-storage-head)"/><text x="493" y="184" text-anchor="middle" class="dgm-text-small">compare</text><text x="493" y="212" text-anchor="middle" class="dgm-text-small">with 3 vectors</text>
<path d="M660 110V158" class="dgm-arrow-accent" marker-end="url(#vector-storage-head-accent)"/><text x="650" y="140" text-anchor="end" class="dgm-text-small">stored vectors</text>
</svg>
