site_name: LLM Course, Explained
site_description: The LLM course syllabus, explained with one tiny example and real numbers.
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

hooks:
  - hooks/widgets.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/widgets.js

nav:
  - Home:
      - index.md
      - The toy example: toy-example.md
  - LLM Fundamentals:
      - 1. Mathematics for machine learning: fundamentals/01-math.md
      - 2. Python for machine learning: fundamentals/02-python.md
      - 3. Neural networks: fundamentals/03-neural-networks.md
      - 4. Natural language processing: fundamentals/04-nlp.md
  - The LLM Scientist:
      - 1. The LLM architecture: scientist/01-architecture.md
      - 2. Pre-training models: scientist/02-pre-training.md
      - 3. Post-training datasets: scientist/03-datasets.md
      - 4. Supervised fine-tuning: scientist/04-fine-tuning.md
      - 5. Preference alignment: scientist/05-preference-alignment.md
      - 6. Evaluation: scientist/06-evaluation.md
      - 7. Quantization: scientist/07-quantization.md
      - 8. New trends: scientist/08-new-trends.md
  - The LLM Engineer:
      - 1. Running LLMs: engineer/01-running-llms.md
      - 2. Building a vector storage: engineer/02-vector-storage.md
      - 3. Retrieval augmented generation: engineer/03-rag.md
      - 4. Advanced RAG: engineer/04-advanced-rag.md
      - 5. Agents: engineer/05-agents.md
      - 6. Inference optimization: engineer/06-inference-optimization.md
      - 7. Deploying LLMs: engineer/07-deploying.md
      - 8. Securing LLMs: engineer/08-securing.md
