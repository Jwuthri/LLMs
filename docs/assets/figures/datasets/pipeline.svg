<svg viewBox="0 0 720 150" role="img" aria-label="Pipeline of a post-training dataset: 3 seed tasks, a generator model that writes instruction and answer, a checker with unit tests that keeps 1 of 4 answers, filters that keep 2 of 6 samples, then a chat template that makes the final ChatML string.">
<defs><marker id="datasets-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker></defs>
<rect x="10" y="30" width="124" height="76" rx="6" class="dgm-box"/><text x="72" y="54" text-anchor="middle" class="dgm-text">Seed tasks</text><text x="72" y="74" text-anchor="middle" class="dgm-text-small">3 short task</text><text x="72" y="90" text-anchor="middle" class="dgm-text-small">descriptions</text>
<rect x="154" y="30" width="124" height="76" rx="6" class="dgm-box-accent"/><text x="216" y="54" text-anchor="middle" class="dgm-text">Generator LLM</text><text x="216" y="74" text-anchor="middle" class="dgm-text-small">writes instruction</text><text x="216" y="90" text-anchor="middle" class="dgm-text-small">+ answer (JSON)</text>
<rect x="298" y="30" width="124" height="76" rx="6" class="dgm-box"/><text x="360" y="54" text-anchor="middle" class="dgm-text">Checker</text><text x="360" y="74" text-anchor="middle" class="dgm-text-small">unit tests keep</text><text x="360" y="90" text-anchor="middle" class="dgm-text-small">1 of 4 answers</text>
<rect x="442" y="30" width="124" height="76" rx="6" class="dgm-box"/><text x="504" y="54" text-anchor="middle" class="dgm-text">Filters</text><text x="504" y="74" text-anchor="middle" class="dgm-text-small">rules, MinHash,</text><text x="504" y="90" text-anchor="middle" class="dgm-text-small">judge: 6 → 2</text>
<rect x="586" y="30" width="124" height="76" rx="6" class="dgm-box"/><text x="648" y="54" text-anchor="middle" class="dgm-text">Chat template</text><text x="648" y="74" text-anchor="middle" class="dgm-text-small">messages →</text><text x="648" y="90" text-anchor="middle" class="dgm-text-small">ChatML string</text>
<path d="M134 68H150" class="dgm-arrow" marker-end="url(#datasets-head)"/><path d="M278 68H294" class="dgm-arrow" marker-end="url(#datasets-head)"/><path d="M422 68H438" class="dgm-arrow" marker-end="url(#datasets-head)"/><path d="M566 68H582" class="dgm-arrow" marker-end="url(#datasets-head)"/>
<text x="144" y="132" text-anchor="middle" class="dgm-text-small">2. Synthetic data generation</text><text x="360" y="132" text-anchor="middle" class="dgm-text-small">3. Data enhancement</text><text x="504" y="132" text-anchor="middle" class="dgm-text-small">4. Quality filtering</text><text x="648" y="132" text-anchor="middle" class="dgm-text-small">1. Chat templates</text>
<path d="M10 114H278" class="dgm-arrow"/><path d="M298 114H422" class="dgm-arrow"/><path d="M442 114H566" class="dgm-arrow"/><path d="M586 114H710" class="dgm-arrow"/>
</svg>
