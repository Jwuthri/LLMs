<svg viewBox="0 0 720 200" role="img" aria-label="The evaluation feedback loop: evaluate the model, sort the errors by category, add training data for the weakest category, train again, then evaluate again on questions that the training never saw.">
<defs><marker id="evaluation-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head"/></marker><marker id="evaluation-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dgm-head-accent"/></marker></defs>
<rect x="14" y="30" width="150" height="84" rx="6" class="dgm-box-accent"/><text x="89" y="56" text-anchor="middle" class="dgm-text">1 Evaluate</text><text x="89" y="78" text-anchor="middle" class="dgm-text-small">accuracy 0.70</text><text x="89" y="96" text-anchor="middle" class="dgm-text-small">300 errors in 1,000</text>
<rect x="196" y="30" width="150" height="84" rx="6" class="dgm-box"/><text x="271" y="56" text-anchor="middle" class="dgm-text">2 Sort the errors</text><text x="271" y="78" text-anchor="middle" class="dgm-text-small">multi-step: 60% wrong</text><text x="271" y="96" text-anchor="middle" class="dgm-text-small">format: 16% wrong</text>
<rect x="378" y="30" width="150" height="84" rx="6" class="dgm-box"/><text x="453" y="56" text-anchor="middle" class="dgm-text">3 Add data</text><text x="453" y="78" text-anchor="middle" class="dgm-text-small">new multi-step</text><text x="453" y="96" text-anchor="middle" class="dgm-text-small">training examples</text>
<rect x="560" y="30" width="146" height="84" rx="6" class="dgm-box"/><text x="633" y="56" text-anchor="middle" class="dgm-text">4 Train again</text><text x="633" y="78" text-anchor="middle" class="dgm-text-small">fine-tuning or</text><text x="633" y="96" text-anchor="middle" class="dgm-text-small">preference alignment</text>
<path d="M164 72H192" class="dgm-arrow" marker-end="url(#evaluation-head)"/><path d="M346 72H374" class="dgm-arrow" marker-end="url(#evaluation-head)"/><path d="M528 72H556" class="dgm-arrow" marker-end="url(#evaluation-head)"/>
<path d="M633 114V156H89V118" class="dgm-arrow-accent" marker-end="url(#evaluation-head-accent)"/>
<text x="360" y="180" text-anchor="middle" class="dgm-text-small">5 Evaluate again, on questions that the training never saw</text>
</svg>
