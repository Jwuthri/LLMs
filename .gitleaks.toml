[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\b(sk-or(-v\d+)?-[a-f0-9]{64})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["sk-or"]

[[rules]]
id = "generic-sk-key"
description = "API key with sk- prefix"
regex = '''\b(sk-[a-zA-Z0-9_\-]{20,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["sk-"]

[[rules]]
id = "tinker-api-key"
description = "Tinker (Thinking Machines) API key"
regex = '''\b(tml-[a-zA-Z0-9_\-]{60,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["tml-"]
